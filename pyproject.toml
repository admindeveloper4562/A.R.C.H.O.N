[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-v2"
version = "0.0.3"
description = "ARCHON main AI, AEGIS guardian, ATLAS infrastructure — JARVIS v2 foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis-v2 = "jarvis_v2.cli:main"
atlas-monitor = "jarvis_v2.monitor:main"
archon-native-controller = "jarvis_v2.native_controller:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-v2"
version = "0.0.3"
description = "ARCHON main AI, AEGIS guardian, ATLAS infrastructure — JARVIS v2 foundation"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[project.scripts]
jarvis-v2 = "jarvis_v2.cli:main"
atlas-monitor = "jarvis_v2.monitor:main"
archon-native-controller = "jarvis_v2.native_controller:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/jarvis-v2" = ["config/modules.json", "config/identities.json"]
